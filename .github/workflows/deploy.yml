name: Deploy to Hostinger

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: governance-production
  cancel-in-progress: false

jobs:
  deploy:
    name: FTP-sync built dashboard to governance.kineticgain.com
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html || (echo "FAIL: dist/index.html missing" && exit 1)
          test -f dist/config.js || (echo "FAIL: dist/config.js missing (runtime config)" && exit 1)
          grep -q "Kinetic Gain Governance" dist/index.html || \
            (echo "FAIL: dist/index.html missing brand string" && exit 1)
          echo "OK: build verified"
          ls -lah dist/

      - name: FTP-Deploy dist/ to /governance/
        timeout-minutes: 5
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          timeout: 60000
          local-dir: ./dist/
          server-dir: /governance/
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/.DS_Store
